<!-- Diese Adresse war bis heute die kanonische Datenschutz-URL, steht in
     sitemap.xml und ist von aussen verlinkt; sie muss weiter aufloesen.
     Den echten 301 macht _redirects auf Netlify. Diese Datei ist der
     Rueckfall: sie leitet per meta-refresh weiter und zeigt einen Satz
     mit Link, falls der Browser der Weiterleitung nicht folgt.
     Kein Plausible: der Seitenaufruf wird auf datenschutz.html gezaehlt. -->
<section class="umzug">
  <div class="wrap">
    <div class="umzug__in">
      <p class="eyebrow">Rechtliches</p>
      <h1>Die Seite ist umgezogen</h1>
      <p>Unsere Datenschutzerklärung steht jetzt unter <b>/datenschutz.html</b>. Du wirst automatisch dorthin weitergeleitet — falls nichts passiert, geht es hier weiter.</p>
      <a class="btn btn--tuerkis" href="datenschutz.html">Zur Datenschutzerklärung</a>
      <span class="stand">301 · /privacy-policy.html → /datenschutz.html</span>
    </div>
  </div>
</section>
